[package]
name = "newtspeak-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "NewtSpeak 机器人开放平台官方 Rust SDK"
license = "MIT"
readme = "README.md"
keywords = ["newtspeak", "owlbot", "bot", "sdk", "chat", "gateway"]
categories = ["api-bindings", "asynchronous", "network-programming"]
repository = "https://github.com/NewtSpeak/NewtBotSdk"
homepage = "https://github.com/NewtSpeak/NewtBotSdk/tree/main/rust"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
name = "newtspeak_bot"
path = "src/lib.rs"
